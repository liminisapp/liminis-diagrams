# Dependency updates arrive as PRs to judge on their own merits: merge the
# green ones. A major that needs code changes is better done as a worked PR
# of its own; close the Dependabot PR (which ignores that version) once that
# work is under way. Weekly, Saturdays 04:00 Eastern.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /demo
      - /docs
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      instantdb:
        patterns: ["@instantdb/*", "instant-cli"]
      runtime-non-major:
        dependency-type: production
        update-types: [minor, patch]
      dev-non-major:
        dependency-type: development
        update-types: [minor, patch]
      # Any other major: one PR per dependency, across every directory above.
      majors:
        update-types: [major]
        group-by: dependency-name
    ignore:
      # @types/node tracks the Node major CI runs (node-version '24' in
      # ci.yml), not the newest release. Newer types would let code call APIs
      # that do not exist on the runtimes this package supports (engines:
      # >=22) without a type error. Raise this bound when CI's Node moves.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/New_York
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
