name: CI

# This repository stands on its own. Nothing here checks out, fetches, or
# authenticates against another repository — that independence is the point of
# the extraction, and it is cheap to lose by accident. Deliberately no
# reference to the repository this package came from appears in this file at
# all, not even in a comment, so that "does CI reach outward?" stays a
# one-line grep.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Defence in depth, not incident response: default_workflow_permissions for
# this repo is already `read`, and pnpm 10 does not run dependency lifecycle
# scripts without an `onlyBuiltDependencies` allowlist, which this repo has
# none of. Neither mitigation is guaranteed to hold — an allowlist entry or an
# org-level permissions change would reopen the gap silently — so the token is
# pinned read-only and off disk here too, matching publish.yml, rather than
# relying on those defaults to keep doing the job.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # Note the gap with `engines.node` in package.json, which says `>=22`:
      # this job runs 24 only. 22 is claimed because it is an LTS release and
      # nothing in the dependency graph needs more, but it is supported by
      # intent rather than by test. Closing that gap means matrixing this job
      # over [22, 24] — worth doing if a consumer reports actually running 22,
      # and not worth the CI minutes before then.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Also run at release time, ahead of `npm publish`. Running it here too
      # means a packaging regression fails a pull request instead of failing a
      # release after the tag has been cut. Note this runs under the runner's
      # own npm, while the release runs under the pinned npm that trusted
      # publishing requires — so the two are not perfectly equivalent, and a
      # defect that only appears on the pinned version can still reach a
      # release. That is exactly what happened to v0.1.1's first attempt.
      # --no-build: the Build step above already produced dist/. Without the
      # flag this script rebuilds, running the slowest part of the job twice.
      - name: Verify the package is publishable
        run: pnpm verify:package --no-build
